[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
]

[tool.ruff]
line-length = 110
target-version = "py310"
# Vendored third-party sources are not ours to lint.
exclude = [
    "sam2_src",
    "third_party",
    "build",
    "dist",
    ".venv",
    "cache_workspace",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends()/File() defaults are the documented pattern
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
